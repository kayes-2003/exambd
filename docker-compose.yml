# Local dev support services only — Supabase itself is used via cloud project
# (or `supabase start` from the Supabase CLI, which spins up its own Docker stack).
version: "3.9"
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
